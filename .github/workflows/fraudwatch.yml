name: FraudWatch checks
on:
  push:
    paths: ['projects/fraudwatch/**', '.github/workflows/fraudwatch.yml']
  pull_request:
    paths: ['projects/fraudwatch/**', '.github/workflows/fraudwatch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/fraudwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/fraudwatch/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m fraudwatch.train
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: projects/fraudwatch/reports/
  streaming-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/fraudwatch
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
      - run: docker compose up -d
      - run: docker compose run --rm --no-deps api python scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color > /tmp/fraudwatch-services.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-service-logs
          path: /tmp/fraudwatch-services.log
      - if: always()
        run: docker compose down -v
