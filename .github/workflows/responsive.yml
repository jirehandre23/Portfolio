name: Responsive portfolio checks
on:
  push:
    paths: ['index.html', 'responsive.css', 'projects/creditlens/*.css', 'projects/creditlens/index.html', 'projects/fraudwatch/index.html', 'projects/fraudwatch/web/**', 'scripts/check-responsive.mjs', '.github/workflows/responsive.yml']
  pull_request:
    paths: ['index.html', 'responsive.css', 'projects/creditlens/*.css', 'projects/creditlens/index.html', 'projects/fraudwatch/index.html', 'projects/fraudwatch/web/**', 'scripts/check-responsive.mjs', '.github/workflows/responsive.yml']
permissions:
  contents: read
jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/portfolio-ui playwright@1.51.1
      - run: node /tmp/portfolio-ui/node_modules/playwright/cli.js install --with-deps chromium webkit
      - run: |
          python -m http.server 9000 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          node scripts/check-responsive.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/portfolio-ui/node_modules/playwright
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: /tmp/portfolio-screenshots/
