name: CreditLens checks
on:
  push:
    paths: ['projects/creditlens/**', '.github/workflows/creditlens.yml']
  pull_request:
    paths: ['projects/creditlens/**', '.github/workflows/creditlens.yml']
permissions:
  contents: read
jobs:
  financial-model:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/creditlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python run.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/parity.mjs
